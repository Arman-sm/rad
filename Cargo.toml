workspace = { members = ["rad_compositor", "rad_net_stream", "rad_remote", "rad_storage"] }
[package]
name = "rad"
repository = "https://github.com/Arman-sm/rad"
readme = "./README.md"
license-file = "./LICENSE"
authors = ["Arman Salimi Moghadam"]
version = "1.0.0"
edition = "2021"

[profile.release]
lto = "fat"

[dependencies]
rad_net_stream = { path = "./rad_net_stream" }
rad_compositor = { path = "./rad_compositor" }
rad_remote = { path = "./rad_remote" }
rad_storage = { path = "./rad_storage" }

clap = { version = "4.6.*", features = ["derive", "env"] }
log = "0.4.*"
simple_logger = "5.2.*"
toml = "1.1.*"
serde = { version = "1.0.*", features = ["derive"] }
futures = "0.3.*"
tokio = { version = "1.53.*", features = ["full"] }
